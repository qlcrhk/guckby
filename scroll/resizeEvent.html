<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>카운팅</h1>
    <script>
        const heading = document.querySelector('h1');
        window.addEventListener('resize',()=>{
            heading.innerText =`${window.innerWidth},${window.innerHeight}`;
            // heading.innerText = `${window.outerWidth},${window.outerHeight}`;

            if(window.innerWidth >1000){
                document.body.style.background = "#fc0"
            }else{
                document.body.style.background = "#fcc"
            }
        })
    </script>
</body>
</html>
