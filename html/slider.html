<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        /* 컨텐츠 영역 설정 */
        .slide-container {
            width: 100vw;
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: 0.3s all;
        }

        /* 컨텐츠 내부영역 설정 */
        .slide-wrapper {
            display: flex;
            position: relative;
            width: 400px;
            height: 600px;
        }

        /* 메인 타이틀 */
        .slide-wrapper h1 {
            user-select: none;
            position: absolute;
            width: 80vw;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            color: white;
            text-align: center;
            font-size: 5em;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
        }

        /* 서브 타이틀 */
        .slide-wrapper h2 {
            user-select: none;
            position: absolute;
            width: 100vw;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            color: white;
            text-align: center;
            font-size: 3em;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
            margin-top: 2em;
        }

        /* 슬라이드 이미지 */
        .slide-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 150px;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            transition: 0.3s all;
            z-index: 1;
        }

        /* 이전 다음 버튼 */
        .btn-box {
            width: 100vw;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            font-size: 50px;
            justify-content: space-between;
        }

        .btn-box .prev-btn,
        .btn-box .next-btn {
            padding: 5px;
            cursor: pointer;
            user-select: none;
            color: rgba(255, 255, 255, 0.4);
            z-index: 1;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
            transition: all 0.3s;
        }

        .btn-box .prev-btn:hover,
        .btn-box .next-btn:hover {
            color: white;
            transition: all 0.3s;
        }
    </style>

</head>

<body>
    <div class="slide-container">
        <div class="slide-wrapper">
            <div class="slide slide-img"></div>
            <div>
                <h1>DEVELOP IN YOUR LIFE</h1>
            </div>
            <div>
                <h2>with Tumb</h2>
            </div>
        </div>
        <div class="btn-box">
            <div class="prev-btn">
                <p>〈</p>
            </div>
            <div class="next-btn">
                <p>〉</p>
            </div>
        </div>
    </div>

    <script>
        // colors와 images 의 갯수를 같게
        // 백그라운드 컬러 저장
        let colors = ['#ddedd5', '#f9c0c0', '#cde3f5'];
        let images = [
            "https://images.pexels.com/photos/466685/pexels-photo-466685.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2",
            "https://images.pexels.com/photos/302769/pexels-photo-302769.jpeg?auto=compress&cs=tinysrgb&w=800",
            "https://images.pexels.com/photos/417192/pexels-photo-417192.jpeg?auto=compress&cs=tinysrgb&w=800"
        ];

        // 현재 컬러와 이미지의 순번 저장
        let currentIndex = 0;

        // interval변수에 setInterval을 저장함
        // 이전 이후 버튼 클릭시 시간을 초기화 시킨후 실행하기 위함
        let interval;
        let startX; // 마우스 시작 X 좌표
        let endX; // 마우스 끝 X 좌표

        // Function to update the slide
        function updateSlide() {
            document.querySelector('.slide-container').style.backgroundColor = colors[currentIndex];
            document.querySelector('.slide-img').style.backgroundImage = `url('${images[currentIndex]}')`;
        }

        // Set the initial background image and color
        updateSlide();

        // Event listener for previous button
        document.querySelector('.prev-btn').addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + colors.length) % colors.length; // Go to the previous index
            updateSlide(); // Update the slide
            resetInterval(); // Reset the interval
        });

        // Event listener for next button
        document.querySelector('.next-btn').addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % colors.length; // Go to the next index
            updateSlide(); // Update the slide
            resetInterval(); // Reset the interval
        });

        // Function to start the interval
        function startInterval() {
            interval = setInterval(() => {
                currentIndex = (currentIndex + 1) % colors.length; // Increment index
                updateSlide(); // Update the slide
            }, 2500);
        }

        // Function to reset the interval
        function resetInterval() {
            clearInterval(interval); // Clear the existing interval
            startInterval(); // Start a new interval
        }

        // Start the interval when the page loads
        startInterval();

        // Mouse down event to store starting X coordinate
        document.querySelector('.slide-container').addEventListener('mousedown', (event) => {
            startX = event.clientX; //사용자가 클릭한 화면의 x위치
        });

        // Mouse up event to detect the end position and calculate distance
        document.querySelector('.slide-container').addEventListener('mouseup', (event) => {
            endX = event.clientX; //사용자가 마우스를 떘을 때 위치
            const distance = endX - startX; //결과값을 저장 +면 이전으로 -면 다음으로 진행

            if (distance > 50) {
                // Move to the previous slide
                currentIndex = (currentIndex - 1 + colors.length) % colors.length;
                updateSlide(); // Update the slide
                resetInterval(); // Reset the interval
            } else if (distance < -50) {
                // Move to the next slide
                currentIndex = (currentIndex + 1) % colors.length;
                updateSlide(); // Update the slide
                resetInterval(); // Reset the interval
            }
        });
    </script>
</body>

</html>
